<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC Raiders Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>html, body, #root { margin: 0; min-height: 100%; } body { background: #f1f5f9; }</style>
</head>
<body>
  <div id="root"><div style="font-family: sans-serif; padding: 2rem">Loading companion...</div></div>
  <script>
    (async () => {
      try {
        let source = await (await fetch('./arc-raiders-companion.jsx?launch=3')).text();
        source = source.replace(/^import\b[\s\S]*?;\s*/gm, '');
        source = source.replace('export default function ArcRaidersCompanion', 'function ArcRaidersCompanion');
        source += '\nwindow.ArcRaidersCompanion = ArcRaidersCompanion;';
        const aliases = 'const { useState, useEffect, useMemo, useCallback, useRef, createContext, useContext } = React;\nconst Icon = (props) => React.createElement("span", props);\nconst Search = Icon, Check = Icon, Package = Icon, BookOpen = Icon, Zap = Icon, Shield = Icon, Wrench = Icon, FlaskConical = Icon, Bomb = Icon, AlertTriangle = Icon, Loader2 = Icon, RotateCcw = Icon, Clock = Icon, Users = Icon, RefreshCw = Icon, Monitor = Icon, Gamepad2 = Icon, Info = Icon, MapIcon = Icon, Skull = Icon, Star = Icon, MapPin = Icon, DoorOpen = Icon, CalendarClock = Icon, ChevronDown = Icon, ChevronUp = Icon, Cog = Icon, Target = Icon, Moon = Icon, CloudLightning = Icon, X = Icon, Sun = Icon;\n';
        const compiled = Babel.transform(aliases + source, { presets: ['react'] }).code;
        new Function('React', compiled)(React);
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.ArcRaidersCompanion));
      } catch (error) {
        document.getElementById('root').innerHTML = '<pre style="white-space: pre-wrap; color: #b91c1c; padding: 2rem; font-family: monospace">' + error.stack + '</pre>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
